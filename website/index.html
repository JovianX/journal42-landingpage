          {
            "@type": "SoftwareApplication",
            "name": "Journal42",
            "url": "https://app.journal42.cloud/",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "Web",
            "description": "Private journaling. Write a fragment, get a short AI reflection, walk away."
          },
          {
            "@type": "FAQPage",
            "@id": "https://journal42.cloud/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is Journal42?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Journal42 is a private journaling app. You write a fragment, save it, and get a short AI reflection you can answer. Two quiet minutes."
                }
              },
              {
                "@type": "Question",
                "name": "Is Journal42 an AI chatbot?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Journal42 is a journal. You write what is still running, get a short AI reflection, and walk away. Reply if you want to go further."
                }
              },
              {
                "@type": "Question",
                "name": "Who is Journal42 for?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "People who still have work in their head after the house goes quiet. Tech work and family logistics in the same nervous system. If Slack is still open after the kids are asleep, this is for that hour."
                }
              },
              {
                "@type": "Question",
                "name": "Is my writing private?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your thoughts stay yours. Writing is tied to your account. We do not sell your journal, and we do not use it as public training material. When you use AI help, relevant parts may be sent to generate the reflection. Optional journal lock encrypts saved entries on your device before sync."
                }
              }
            ]
          }
        ]
      }
    </script>
